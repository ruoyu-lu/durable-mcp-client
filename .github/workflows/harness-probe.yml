name: Harness feasibility probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/probes/harness/**'
      - '.github/workflows/harness-probe.yml'
  push:
    branches: [main]
    paths:
      - 'tests/probes/harness/**'
      - '.github/workflows/harness-probe.yml'
permissions:
  contents: read
jobs:
  harness-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/probes/harness/package-lock.json
      - run: npm --prefix tests/probes/harness ci --ignore-scripts --legacy-peer-deps=false
      - run: npm --prefix tests/probes/harness test
