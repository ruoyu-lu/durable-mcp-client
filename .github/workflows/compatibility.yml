name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  fastmcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/fastmcp/requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r examples/fastmcp/requirements.txt
      - run: npm run test:fastmcp
        env:
          FASTMCP_PYTHON: python
      - name: Install isolated-test Redis runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          redis-server --version
      - run: npm run test:fastmcp:restart
        env:
          FASTMCP_PYTHON: python
